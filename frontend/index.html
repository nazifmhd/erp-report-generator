<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ERP AI Report Generator</title>

  <!-- Tailwind CSS CDN -->
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.16/dist/tailwind.min.css" rel="stylesheet" />

  <!-- Google Fonts for better typography -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

  <!-- Chart.js CDN -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <!-- jsPDF CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

  <script>
    let chartInstance = null;
    let loading = false;

    async function generateReport() {
      loading = true;
      toggleLoader();

      const region = document.getElementById('regionFilter').value;
      const category = document.getElementById('categoryFilter').value;

      const url = `http://127.0.0.1:8000/generate-report?region=${region}&category=${category}`;
      const response = await fetch(url);
      const data = await response.json();

      // Display report
      const reportText = data.report || "No report data available.";
      document.getElementById('report').innerText = reportText;

      // Generate Chart
      if (data.sales_data) {
        generateChart(data.sales_data.labels, data.sales_data.data);
      }

      loading = false;
      toggleLoader();
    }

    function toggleLoader() {
      const loader = document.getElementById('loader');
      const content = document.getElementById('content');
      if (loading) {
        loader.classList.remove('hidden');
        content.classList.add('hidden');
      } else {
        loader.classList.add('hidden');
        content.classList.remove('hidden');
      }
    }

    function generateChart(labels, data) {
      const ctx = document.getElementById('salesChart').getContext('2d');

      // Destroy old chart if exists
      if (chartInstance) {
        chartInstance.destroy();
      }

      chartInstance = new Chart(ctx, {
        type: 'bar',
        data: {
          labels: labels,
          datasets: [{
            label: 'Sales by Product',
            data: data,
            backgroundColor: 'rgba(53, 162, 235, 0.5)',
            borderColor: 'rgba(53, 162, 235, 1)',
            borderWidth: 1
          }]
        },
        options: {
          responsive: true,
          scales: {
            y: {
              beginAtZero: true
            }
          }
        }
      });
    }

    function exportToPDF() {
      const { jsPDF } = window.jspdf;
      const doc = new jsPDF();

      const reportContent = document.getElementById('report').innerText;
      if (!reportContent.trim()) {
        alert("Please generate the report first.");
        return;
      }

      const lines = doc.splitTextToSize(reportContent, 180); // wrap text width
      doc.text(lines, 10, 10);
      doc.save("erp-report.pdf");
    }
  </script>
</head>
<body class="font-poppins bg-gradient-to-r from-blue-400 via-purple-500 to-pink-600 p-6">

  <!-- Navigation Bar -->
  <!-- <nav class="bg-blue-600 p-4 mb-6 shadow-md">
    <div class="container mx-auto flex justify-between items-center">
      <a href="#" class="text-white text-2xl font-bold">ERP AI Generator</a>
      <div class="hidden md:flex space-x-6">
        <a href="#" class="text-white hover:underline">Home</a>
        <a href="#" class="text-white hover:underline">About</a>
        <a href="#" class="text-white hover:underline">Contact</a>
      </div>
    </div>
  </nav> -->

  <div class="container mx-auto" id="content">
    <h1 class="text-4xl font-extrabold text-center text-white mb-6 drop-shadow-lg transition-all duration-300 ease-in-out transform hover:scale-105">ERP AI Report Generator</h1>

    <!-- Filters -->
    <div class="mb-6 flex justify-center space-x-6">
      <div class="bg-white p-6 rounded-xl shadow-lg w-60 hover:shadow-2xl transition-all duration-300 ease-in-out">
        <label for="regionFilter" class="block text-lg font-medium text-gray-700 mb-2">Select Region:</label>
        <select id="regionFilter" class="w-full p-2 border rounded-md text-gray-800 focus:outline-none focus:ring-2 focus:ring-purple-500">
          <option value="East">East</option>
          <option value="West">West</option>
          <option value="North">North</option>
          <option value="South">South</option>
        </select>
      </div>

      <div class="bg-white p-6 rounded-xl shadow-lg w-60 hover:shadow-2xl transition-all duration-300 ease-in-out">
        <label for="categoryFilter" class="block text-lg font-medium text-gray-700 mb-2">Select Category:</label>
        <select id="categoryFilter" class="w-full p-2 border rounded-md text-gray-800 focus:outline-none focus:ring-2 focus:ring-purple-500">
          <option value="Furniture">Furniture</option>
          <option value="Electronics">Electronics</option>
          <option value="Stationery">Stationery</option>
          <option value="Accessories">Accessories</option>
        </select>
      </div>
    </div>

    <!-- Buttons -->
    <div class="mb-6 flex justify-center space-x-6">
      <button onclick="generateReport()" class="bg-gradient-to-r from-green-400 to-blue-500 text-white px-6 py-3 rounded-lg hover:from-green-500 hover:to-blue-600 shadow-xl transform hover:scale-105 transition-all duration-300 ease-in-out" title="Generate the report based on the selected filters">Generate Report</button>
      <button onclick="exportToPDF()" class="bg-gradient-to-r from-yellow-400 to-red-500 text-white px-6 py-3 rounded-lg hover:from-yellow-500 hover:to-red-600 shadow-xl transform hover:scale-105 transition-all duration-300 ease-in-out" title="Export the generated report to PDF">Export as PDF</button>
    </div>

    <!-- Report Output -->
    <div class="bg-white p-6 rounded-xl shadow-lg mb-6 hover:shadow-2xl transition-all duration-300 ease-in-out">
      <h2 class="text-2xl font-semibold text-gray-800">Generated Report:</h2>
      <pre id="report" class="mt-4 text-gray-600 whitespace-pre-wrap"></pre>
    </div>

    <!-- Chart Output -->
    <div class="bg-white p-6 rounded-xl shadow-lg hover:shadow-2xl transition-all duration-300 ease-in-out">
      <h2 class="text-2xl font-semibold text-gray-800">Sales Overview</h2>
      <canvas id="salesChart" class="mt-4"></canvas>
    </div>
  </div>

  <!-- Loading Spinner -->
  <div id="loader" class="hidden fixed top-0 left-0 w-full h-full bg-gray-700 bg-opacity-50 flex items-center justify-center">
    <div class="spinner-border animate-spin h-24 w-24 border-t-4 border-blue-500 rounded-full"></div>
  </div>
  
</body>
</html>
